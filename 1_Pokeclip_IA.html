<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pokeclip · IA</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif;
         background:#ffffff; width:2280px; position:relative; -webkit-font-smoothing:antialiased; color:#111111; }

  /* 상단 타이틀 — 검정 띠 + 굵은 흰 제목 + 얇은 밑줄 바 (EDGE 슬라이드 문법, 3_SA에서 이식) */
  .title-bar { position:absolute; left:34px; top:24px; height:66px; background:#111111;
               display:flex; align-items:center; padding:0 26px 0 22px; }
  .title-bar h1 { font-size:34px; font-weight:800; color:#ffffff; letter-spacing:-0.5px; }
  .title-underline { position:absolute; left:34px; top:98px; width:452px; height:8px; background:#111111; }
  .subtitle { position:absolute; left:36px; top:118px; font-size:14.5px; color:#111827; }

  /* 노드 — EDGE 정보구조: 아주 작은 흰 사각 + 얇은 검정 테두리 + 검정 텍스트. 색·그룹박스 없음(순수 모노크롬). */
  .node { position:absolute; background:#ffffff; border:1px solid #111111; border-radius:2px;
          display:flex; align-items:center; justify-content:center; text-align:center;
          font-size:10.5px; font-weight:500; color:#111111; line-height:1.24; padding:4px 7px;
          transform:translateY(-50%); }
  .node b { font-weight:700; }
  .node.root { border-width:1.6px; font-weight:800; font-size:12.5px; }
  .node.cat  { border-width:1.4px; font-weight:700; font-size:11px; }

  svg.wires { position:absolute; left:0; top:0; pointer-events:none; }
</style>
</head>
<body>
  <div class="title-bar"><h1>Information Architecture</h1></div>
  <div class="title-underline"></div>
  <div class="subtitle">역할별 접근 → 제품 영역 → 페이지 / 화면 → 주요 액션 · 웹 대시보드 + Windows OBS 플러그인 정보구조 (기능 ID A1~I7 · 문서 9 근거)</div>

  <svg class="wires" id="wires"></svg>
  <div id="nodes"></div>

<script>
(function(){
  // EDGE p.1 정보구조 트리: 루트(메인) 최상단 중앙 → 좌/우 밴드로 대분기 → 밴드별 L→R 열 스택.
  // 배선은 기하 파서(diagramGraph.ts mode 1) 대응 — 각 선의 양 끝점이 대상 노드 테두리 위에 놓인다.
  // 끝점 좌표는 노드 모델 좌표(left=x, center=y via translateY, width=w)에서 계산 → 렌더 경계와 일치.
  // 파서 오탐 방지: id 문자열 쌍 호출·id 문자열 2원소 배열리터럴은 쓰지 않는다. 좌표(숫자)만으로 배선한다.

  const LX = [210, 470, 780], LW = [185, 225, 205];   // 좌측 밴드 열 x / 폭 (head·child·grandchild)
  const RX = [1300, 1560, 1870], RW = [185, 225, 200]; // 우측 밴드 열 x / 폭
  const ROWH = 48, CATGAP = 24, TOPY = 300;
  const BUSY = 230, LEFT_SPINE = LX[0] - 30, RIGHT_SPINE = RX[0] - 30;

  function n(t, ch){ return { t:t, ch:ch||null }; }
  const leftTree = [
    n('제품 영역 · Windows OBS 플러그인 (스트리머)', [
      n('송출 설정 화면 [A1·A5]', [ n('SRT 병행 송출·자동 재연결 [A1·A5]') ]),
      n('오디오 트랙 화면 [A2·A3]', [ n('소스별 트랙 선택·라벨 (~10트랙) [A2·A3]') ]),
      n('핫키 설정 화면 [A4]', [ n('하이라이트 구간 마킹 [A4]') ]),
      n('송출 상태 위젯 [A6]', [ n('RTT·손실·재연결 상태 확인 [A6]') ]),
      n('업데이트 안내 화면 [A7]', [ n('GitHub Release의 Windows 빌드 확인 [A7]') ]),
    ]),
    n('제품 영역 · 온보딩 (스트리머)', [
      n('플러그인 설치 화면 [A7]', [ n('Windows 빌드 설치·업데이트 [A7]') ]),
      n('방송 채널 연결 화면 [H2]', [ n('치지직·SOOP 채널 등록 [H2]') ]),
      n('유튜브 연동 화면 [H3]', [ n('OAuth 채널 연결 [H3]') ]),
      n('연결 테스트 화면 [A1·A3]', [ n('SRT·트랙 매니페스트 확인 [A1·A3]') ]),
    ]),
    n('제품 영역 · 라이브 뷰 (스트리머·편집자)', [
      n('라이브 대시보드 페이지 [D1~D4]', [
        n('저지연 재생·DVR 1h 시킹 [D1]'),
        n('자동·핫키 점프카드 확인 [C3·A4·D2]'),
        n('카드 만료 확인 (1h) [D2]'),
        n('카드 시점 이동·에디터 진입 [D4]'),
        n('채팅량 차트 확인 [D3]'),
        n('SRT 송출 상태 확인 [A6]'),
      ]),
    ]),
    n('제품 영역 · 클립 에디터 (스트리머·편집자)', [
      n('클립 편집 페이지 [E1~E8]', [
        n('5초~3분 구간 선택 [E1]'),
        n('화면비율·크롭 선택 [E5]'),
        n('무음 필터·트랙 미리듣기·볼륨 조정 [E2]'),
        n('트랙별 웨이브폼 확인 [E3]'),
        n('AI 자막 생성·편집 [E4]'),
        n('클라이언트 미리보기 [E6]'),
        n('추천 제목 생성·수정 [E7]'),
        n('레시피 저장·렌더 요청 [E8·F1·F2]'),
        n('직접 업로드 또는 승인 요청 [F3·H5]'),
      ]),
    ]),
  ];
  const rightTree = [
    n('제품 영역 · 클립 보관함 (스트리머·편집자)', [
      n('클립 목록 페이지 [E8·F2]', [
        n('렌더 중·승인 대기·완료 필터 [F2]'),
        n('레시피 열기·재편집 [E8]'),
      ]),
      n('승인 대기함 페이지 [H5]', [
        n('스트리머 승인·반려 [H5]'),
        n('편집자 내 요청 확인 [H5]'),
      ]),
      n('업로드 결과 페이지 [F2·F3]', [
        n('유튜브 링크·실패 사유 확인 [F3]'),
        n('실패 잡 수동 재시도 [F2]'),
      ]),
    ]),
    n('제품 영역 · VOD (스트리머·편집자)', [
      n('VOD 목록 페이지 [B5]', [
        n('남은 보관일 확인 [B5]'),
      ]),
      n('VOD 플레이어 페이지 [G1·G2]', [
        n('점프카드 챕터 탐색 [G1]'),
        n('오디오 트랙 전환 [B3]'),
        n('VOD 구간으로 클립 만들기 [G2]'),
      ]),
    ]),
    n('제품 영역 · 템플릿·설정 (스트리머)', [
      n('자동화 템플릿 페이지 [F4]', [
        n('비율·자막·프리롤·공개범위 저장 [F4]'),
      ]),
      n('편집자 관리 페이지 [H4]', [
        n('초대·직접 업로드·자동 업로드 권한 설정 [H4]'),
      ]),
      n('연동 관리 페이지 [H2·H3]', [
        n('방송 플랫폼·유튜브 채널 연결 관리 [H2·H3]'),
      ]),
      n('계정 설정 페이지 [H1]', [
        n('구글 계정 확인·탈퇴 [H1]'),
      ]),
    ]),
    n('제품 영역 · 운영 콘솔 (운영자)', [
      n('운영 대시보드 페이지 [I3]', [
        n('큐·인제스트·스토리지 상태 확인 [I3]'),
      ]),
      n('운영 관리 페이지 [I4]', [
        n('계정·사용 현황 확인 [I4]'),
        n('장애·업로드 실패 대응 [I4]'),
      ]),
    ]),
  ];

  // ---- 레이아웃: 리프는 세로 스택, 내부 노드는 자식 중앙, x는 밴드 열 ----
  let Y = TOPY;
  function layout(node, depth, XS, WS){
    node.x = XS[depth]; node.w = WS[depth]; node.depth = depth;
    if(node.ch && node.ch.length){
      node.ch.forEach(function(c){ layout(c, depth + 1, XS, WS); });
      node.y = (node.ch[0].y + node.ch[node.ch.length - 1].y) / 2;
    } else {
      node.y = Y; Y += ROWH;
    }
  }
  Y = TOPY; leftTree.forEach(function(c){ layout(c, 0, LX, LW); Y += CATGAP; });
  const leftEnd = Y;
  Y = TOPY; rightTree.forEach(function(c){ layout(c, 0, RX, RW); Y += CATGAP; });
  const rightEnd = Y;
  const H = Math.round(Math.max(leftEnd, rightEnd) + 90);

  const root  = { t:'역할별 메인 대시보드',        x:1035, w:210, y:150, h:46, cls:'root' };
  const login = { t:'로그인 (Google OAuth) [H1]', x:1040, w:200, y:64,  h:40, cls:'root' };

  // ---- 노드 렌더 ----
  const box = document.getElementById('nodes');
  function fidHtml(t){ return t.replace(/\[([A-Z0-9·/~]+)\]/g, '<b>[$1]</b>'); }
  function renderNode(node, cls){
    const div = document.createElement('div');
    div.className = 'node ' + (cls || (node.depth === 0 ? 'cat' : 'nd'));
    div.style.left = node.x + 'px';
    div.style.top = node.y + 'px';
    div.style.width = node.w + 'px';
    if(node.h) div.style.height = node.h + 'px';
    div.innerHTML = fidHtml(node.t);
    box.appendChild(div);
    (node.ch || []).forEach(function(c){ renderNode(c); });
  }
  renderNode(login, 'root'); renderNode(root, 'root');
  leftTree.forEach(function(c){ renderNode(c); });
  rightTree.forEach(function(c){ renderNode(c); });

  // ---- 배선(직교 엘보) ----
  const svg = document.getElementById('wires');
  const NS = 'http://www.w3.org/2000/svg';
  svg.setAttribute('width', 2280); svg.setAttribute('height', H);
  document.body.style.height = H + 'px';
  svg.innerHTML = '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.6" orient="auto" markerUnits="userSpaceOnUse">'
    + '<path d="M1,1 L7,3.6 L1,6.2" fill="none" stroke="#111111" stroke-width="1.15"/></marker></defs>';
  function drawPath(pts){
    let d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for(let i = 1; i < pts.length; i += 1){ d += ' L ' + pts[i].x + ' ' + pts[i].y; }
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#111111'); p.setAttribute('stroke-width', '1');
    p.setAttribute('marker-end', 'url(#ar)');
    svg.appendChild(p);
  }
  // login -> root (세로)
  drawPath([ {x:login.x + login.w/2, y:login.y + login.h/2}, {x:root.x + root.w/2, y:root.y - root.h/2} ]);
  // root -> 각 카테고리 head (좌/우 스파인 경유)
  const rb = { x:root.x + root.w/2, y:root.y + root.h/2 };
  leftTree.forEach(function(c){
    drawPath([ rb, {x:rb.x, y:BUSY}, {x:LEFT_SPINE, y:BUSY}, {x:LEFT_SPINE, y:c.y}, {x:c.x, y:c.y} ]);
  });
  rightTree.forEach(function(c){
    drawPath([ rb, {x:rb.x, y:BUSY}, {x:RIGHT_SPINE, y:BUSY}, {x:RIGHT_SPINE, y:c.y}, {x:c.x, y:c.y} ]);
  });
  // parent -> child (밴드 내 거터 엘보)
  function wireChildren(node){
    (node.ch || []).forEach(function(c){
      const midX = (node.x + node.w + c.x) / 2;
      drawPath([ {x:node.x + node.w, y:node.y}, {x:midX, y:node.y}, {x:midX, y:c.y}, {x:c.x, y:c.y} ]);
      wireChildren(c);
    });
  }
  leftTree.forEach(wireChildren); rightTree.forEach(wireChildren);
})();
</script>
</body>
</html>
